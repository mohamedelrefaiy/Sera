[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sera"
version = "0.1.0"
description = "Rank + adversarially verify druggable T-cell regulators from Perturb-seq"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "claude-agent-sdk>=0.2.111",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # The served app reads the concordance parquet at request time (api/app.py, llm/concord_tools.py),
  # so pandas + a parquet engine are RUNTIME deps, not just build-time. A clean install without these
  # boots but 503s on the first gene view — see eval/test_clean_install.py.
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = ["plotly>=5.24"]   # interactive figures (plotly skill); not a core-pipeline dep
# The Sera h5ad → cytokine-parquet extraction (pipeline/). Deliberately SEPARATE from the
# core deps: the base app stays stdlib-only for data/verify, and these heavy libs are needed
# only at build time to produce the parquet artifact — never on the request hot path.
pipeline = [
  "h5py>=3.10",
  "fsspec>=2024.2",
  "aiohttp>=3.9",     # fsspec https backend (range requests over plain HTTPS)
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15.0",    # parquet writer
  "pyyaml>=6.0",      # reads config.yaml
]

[project.scripts]
sera = "sera.__main__:main"
sera-serve = "sera.api.serve:main"

# App-layout: the package sits directly under application/ (no src/ wrapper).
[tool.setuptools.packages.find]
where = ["."]
include = ["sera*"]

# The screen CSVs, the deterministic artifacts (parquet/json/yaml the served app reads at
# request time), and the served frontend are bundled inside the package, so they must ship with
# an install — they are not .py and would otherwise be dropped, leaving a clean install that boots
# but 503s on the first gene view.
[tool.setuptools.package-data]
sera = [
  "data/**/*.csv",
  "data/**/*.md",
  "data/**/*.parquet",
  "data/**/*.json",
  "data/**/*.yaml",
  "frontend/**/*",
  "clients/*.json",
]
